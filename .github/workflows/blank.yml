name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and validate project files
        run: |
          if [ -f PrivateDnsToggle_AndroidProject.zip ]; then
            unzip -o PrivateDnsToggle_AndroidProject.zip
          fi
          python3 - << 'EOF'
          import os
          dns_path = "app/src/main/java/com/example/privatednstoggle/DnsRepository.kt"
          if os.path.exists(dns_path):
              with open(dns_path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = s.replace(r"\-", r"\\-").replace(r"\.", r"\\.").replace(r"\\\-", r"\\-").replace(r"\\\.", r"\\.")
              with open(dns_path, "w", encoding="utf-8") as f:
                  f.write(s)
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m = f.read()
              m = m.replace("@mipmap/ic_launcher_round", "@drawable/ic_qs_dns").replace("@mipmap/ic_launcher", "@drawable/ic_qs_dns")
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateDnsToggle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
